# CloudTry Docker Compose Configuration for Staging
# 用于预发布环境部署

services:
  # ==========================================
  # 基础设施服务
  # ==========================================
  
  # Nacos 服务注册与配置中心
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: cloudtry-nacos-staging
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Sentinel Dashboard
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: cloudtry-sentinel-staging
    ports:
      - "8858:8858"
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858"
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: cloudtry-redis-staging
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ==========================================
  # 应用服务
  # ==========================================
  
  # Gateway 网关服务
  gateway:
    image: ${DOCKER_USERNAME:-cloudtry}/cloudtry-gateway:${CANARY_VERSION:-latest}
    container_name: cloudtry-gateway-staging
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=staging
      # Nacos服务发现容错配置
      - SPRING_CLOUD_NACOS_DISCOVERY_FAIL_FAST=false
      - SPRING_CLOUD_NACOS_DISCOVERY_MAX_RETRY=5
      - SPRING_CLOUD_NACOS_DISCOVERY_RETRY_DELAY=2000
      - SPRING_CLOUD_NACOS_DISCOVERY_HEART_BEAT_INTERVAL=5000
      - SPRING_CLOUD_NACOS_DISCOVERY_HEART_BEAT_TIMEOUT=15000
      # Nacos配置中心容错配置
      - SPRING_CLOUD_NACOS_CONFIG_ENABLED=true
      - SPRING_CLOUD_NACOS_CONFIG_TIMEOUT=30000
      - SPRING_CLOUD_NACOS_CONFIG_RETRY=5
      - SPRING_CLOUD_NACOS_CONFIG_RETRY_DELAY=1000
      # Sentinel配置
      - SENTINEL_DASHBOARD=sentinel:8858
      - SPRING_CLOUD_SENTINEL_EAGER=true
      # 优雅停机配置
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Service-Order 订单服务
  service-order:
    image: ${DOCKER_USERNAME:-cloudtry}/cloudtry-service-order:${CANARY_VERSION:-latest}
    container_name: cloudtry-service-order-staging
    ports:
      - "8000:8000"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_PROFILES_ACTIVE=staging
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/cloudtry_order?useSSL=false&serverTimezone=Asia/Shanghai}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Service-Product 商品服务
  service-product:
    image: ${DOCKER_USERNAME:-cloudtry}/cloudtry-service-product:${CANARY_VERSION:-latest}
    container_name: cloudtry-service-product-staging
    ports:
      - "9000:9000"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_PROFILES_ACTIVE=staging
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/cloudtry_product?useSSL=false&serverTimezone=Asia/Shanghai}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Service-User 用户服务
  service-user:
    image: ${DOCKER_USERNAME:-cloudtry}/cloudtry-service-user:${CANARY_VERSION:-latest}
    container_name: cloudtry-service-user-staging
    ports:
      - "7000:7000"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_PROFILES_ACTIVE=staging
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/cloudtry_user?useSSL=false&serverTimezone=Asia/Shanghai}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

# ==========================================
# 网络配置
# ==========================================
networks:
  cloudtry-network:
    driver: bridge

# ==========================================
# 卷配置
# ==========================================
volumes:
  mysql_data:
  redis_data:
  nacos_data: