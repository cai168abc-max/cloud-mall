# CloudTry Docker Compose Configuration for Staging
# 用于预发布环境部署

version: '3.8'

services:
  # ==========================================
  # 基础设施服务
  # ==========================================
  
  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: cloudtry-redis-staging
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ==========================================
  # 应用服务
  # ==========================================
  
  # Gateway 网关服务
  gateway:
    image: ${DOCKER_USERNAME}/cloudtry-gateway:latest
    container_name: cloudtry-gateway-staging
    environment:
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_PROFILES_ACTIVE=staging
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Service-Order 订单服务
  service-order:
    image: ${DOCKER_USERNAME}/cloudtry-service-order:latest
    container_name: cloudtry-service-order-staging
    environment:
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_PROFILES_ACTIVE=staging
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/cloudtry_order?useSSL=false&serverTimezone=Asia/Shanghai}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 150s
    restart: unless-stopped
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Service-Product 商品服务
  service-product:
    image: ${DOCKER_USERNAME}/cloudtry-service-product:latest
    container_name: cloudtry-service-product-staging
    environment:
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_PROFILES_ACTIVE=staging
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/cloudtry_product?useSSL=false&serverTimezone=Asia/Shanghai}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 150s
    restart: unless-stopped
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Service-User 用户服务
  service-user:
    image: ${DOCKER_USERNAME}/cloudtry-service-user:latest
    container_name: cloudtry-service-user-staging
    environment:
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_PROFILES_ACTIVE=staging
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/cloudtry_user?useSSL=false&serverTimezone=Asia/Shanghai}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 150s
    restart: unless-stopped
    networks:
      - cloudtry-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

# ==========================================
# 网络配置
# ==========================================
networks:
  cloudtry-network:
    driver: bridge

# ==========================================
# 卷配置
# ==========================================
volumes:
  mysql_data:
  redis_data:
  nacos_data: