spring:
  application:
    name: service-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3307/cloudtry_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: UserHikariCP
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        shared-configs:
          - data-id: common-sentinel-rules.yml
            group: SENTINEL_GROUP
            refresh: true
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8081}
      datasource:
        # 流量控制规则
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules.json
            rule-type: flow
            refresh: true
        # 熔断降级规则
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules.json
            rule-type: degrade
            refresh: true

server:
  port: 7000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.atguigu.common
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境应关闭SQL日志输出，通过环境变量控制
    # 开发环境: org.apache.ibatis.logging.stdout.StdOutImpl
    # 生产环境: org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

seata:
  enabled: true
  application-id: service-user
  tx-service-group: default_tx_group
  enable-auto-data-source-proxy: true
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      namespace: ${NACOS_NAMESPACE:}
      group: SEATA_GROUP
      # 安全配置：强制要求配置凭据，不允许空值
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      data-id: seata-config.properties
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      namespace: ${NACOS_NAMESPACE:}
      group: SEATA_GROUP
      application: seata-server
      # 安全配置：强制要求配置凭据，不允许空值
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
  client:
    rm:
      async-commit-buffer-limit: 1000
    tm:
      default-global-transaction-timeout: 60000

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: user-producer-group
    send-message-timeout: 30000
    max-message-size: 4194304

security:
  jwt:
    secret: ${JWT_SECRET:}
  internal:
    secret: ${INTERNAL_SECRET}

# 文件上传配置
file:
  upload:
    path: ${FILE_UPLOAD_PATH:/data/uploads}
    max-size: 5242880  # 5MB
    allowed-types: jpg,jpeg,png,gif,webp
    rate-limit: 10  # 每分钟最多上传10次
    base-url: /api/file
